<!doctype html>
<!-- Hero style b-ticker. Photos in ../img were generated through gateway.respan.ai (seedream-5.0-flash). -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 760px; overflow: hidden; background: #000; }
  body { position: relative; color: #f9fafc; -webkit-font-smoothing: antialiased;
    font: 15px/1.35 Inter, -apple-system, "SF Pro Text", "Segoe UI", Helvetica, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  .card { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 1100px; z-index: 5;
    background: rgba(9, 9, 14, .97); border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 50px 120px 10px #000, 0 20px 40px -20px rgba(0,0,0,.6); }
  .bar { position: relative; height: 70px; display: flex; align-items: center; padding: 0 28px; }
  .bar i { width: 18px; height: 18px; border-radius: 50%; margin-right: 11px; display: block; }
  .bar .ti { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: -.02em; color: #f4f4f6; }
  .bar .ti img { height: 26px; }
  .card pre { padding: 18px 56px 52px; font-size: 52px; line-height: 1.6; letter-spacing: -.5px; color: #e9e9ee; }
  .card pre .p { color: #8f9cff; }
  .cur { display: inline-block; width: 28px; height: 56px; background: #e9e9ee; vertical-align: -10px; margin-left: 10px; }

  .rows { position: absolute; inset: -160px -200px; transform: rotate(-8deg); display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 14px; white-space: nowrap; }
  .pill { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 24px; border-radius: 999px; background: #131317;
    box-shadow: inset 0 0 0 1px #26262c; font-size: 22px; font-weight: 500; letter-spacing: -.01em; color: #e6e7ec; flex: none; }
  .pill.ph { padding: 0; width: 150px; overflow: hidden; }
  .pill.ph img { width: 100%; height: 100%; object-fit: cover; }
  .pill.ph { position: relative; }
  .pill .play { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(0,0,0,.55); }
  .pill .play::before { content: ""; position: absolute; left: 11px; top: 8px; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .pill .k { font-size: 15px; color: #8b8d96; font-family: Inter, -apple-system, Helvetica, sans-serif; }
  .pill .w { display: flex; align-items: center; gap: 3px; height: 30px; }
  .pill .w i { width: 3px; border-radius: 2px; background: #e6e7ec; display: block; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .shade { position: absolute; inset: 0; z-index: 2; background: radial-gradient(ellipse 46% 52% at 50% 52%, rgba(0,0,0,.96), rgba(0,0,0,.88) 55%, rgba(0,0,0,.4)); }

</style></head><body>
<div class="rows" id="rows"></div><div class="shade"></div>
<div class="card">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <span class="ti"><img src="../../vendors/respan-dark.svg" alt="">Get started with Respan Gateway</span></div>
<pre class="mono"><span class="p">pip install</span> respan-gateway
<span class="p">respan-gateway</span><span class="cur"></span></pre>
</div>
<script>
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // maker marks: the repo's vendor logos, plus respan.ai's for the rest (dark fill, inverted)
  const MK = { anthropic: '../../vendors/anthropic-dark.svg', openai: '../../vendors/openai-dark.svg', google: '../../vendors/gemini.svg',
    xai: '../../vendors/xai-dark.svg', deepseek: '../../vendors/deepseek.svg', mistral: '../../vendors/mistral.svg',
    qwen: '../logos/qwen.svg', moonshot: '../logos/moonshot.svg', z_ai: '../logos/z_ai.svg', minimax: '../logos/minimax.svg' };
  const INV = { qwen: 'invert(1)', moonshot: 'invert(1)', z_ai: 'invert(1)', minimax: 'brightness(0) invert(.89)' };
  const mark = (m, px) => `<img src="${MK[m]}" style="width:${px}px;height:${px}px;flex:none;filter:${INV[m] || 'none'}">`;
  const MODELS = [['anthropic','claude-opus-5-5'],['openai','gpt-6-luna'],['google','gemini-4-argon'],['deepseek','deepseek-v4.1-flash'],
    ['mistral','mistral-large-3'],['xai','grok-4.7'],['qwen','qwen3.8-max'],['moonshot','kimi-k3'],['anthropic','claude-sonnet-5-5'],
    ['z_ai','glm-5.3'],['openai','gpt-6.1-sol'],['minimax','minimax-m3'],['google','gemini-3.8-flash'],['anthropic','claude-haiku-5-5'],
    ['deepseek','deepseek-v4-pro'],['openai','gpt-6-astra']];
  const PHOTOS = ['p1','p5','p2','p9','p3','p6','p4','p7','p8','p10'];

  // the other kinds the gateway carries, as pills between the models
  const wave = n => { let w = ''; for (let i = 0; i < n; i++) w += `<i style="height:${5 + Math.abs(Math.sin(i * .6)) * rnd() * 24}px"></i>`; return `<span class="w">${w}</span>`; };
  const vec = () => { const v = []; for (let i = 0; i < 4; i++) v.push((rnd() * 2 - 1).toFixed(2)); return `[${v.join(', ')}, …]`; };
  const KINDS = [
    () => `<span class="pill">${mark('openai', 24)}<span class="mono">gpt-realtime</span>${wave(16)}</span>`,
    () => `<span class="pill"><span class="dot" style="background:#ffb340"></span><span class="k">embedding</span><span class="mono">${vec()}</span></span>`,
    () => `<span class="pill ph" style="width:190px"><img src="../img/${PHOTOS[p++ % PHOTOS.length]}.jpg"><span class="play"></span></span>`,
    () => `<span class="pill">${mark('google', 24)}<span class="mono">gemini-live</span>${wave(16)}</span>`,
    () => `<span class="pill"><span class="dot" style="background:#f55656"></span><span class="mono">web_search("flights to Tokyo")</span></span>`,
    () => `<span class="pill"><span class="dot" style="background:#31de4b"></span><span class="k">transcript</span>“Book a table for two”</span>`,
    () => `<span class="pill">${mark('mistral', 24)}<span class="k">speech</span>${wave(14)}</span>`,
    () => `<span class="pill ph"><img src="../img/${PHOTOS[p++ % PHOTOS.length]}.jpg"></span>`,
  ];
  let k = 0, p = 0, q = 0, h = '';
  for (let r = 0; r < 14; r++) { let row = '';
    for (let i = 0; i < 13; i++) {
      if ((r * 5 + i * 3) % 4 === 1) row += KINDS[q++ % KINDS.length]();
      else { const [m, id] = MODELS[k++ % MODELS.length]; row += `<span class="pill mono">${mark(m, 24)}${id}</span>`; } }
    h += `<div class="row" style="margin-left:${-(r * 97) % 260}px">${row}</div>`; }
  document.getElementById('rows').innerHTML = h;

</script></body></html>
